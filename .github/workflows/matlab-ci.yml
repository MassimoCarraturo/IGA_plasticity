name: MATLAB CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - build
          - unit
          - smoke
          - benchmark
          - all

jobs:
  # ---------------------------------------------------------------
  #  Job 1: Build MEX binaries
  # ---------------------------------------------------------------
  build:
    name: Build MEX
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: MATLAB

      - name: Build MEX binaries
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd(fullfile(pwd, 'geopdes_hierarchical_plasticity', ...
               'quasi_interpolant_hierarchical', 'libqi'));
            build_mex();

      - name: Upload MEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mex-binaries
          path: |
            geopdes_hierarchical_plasticity/quasi_interpolant_hierarchical/libqi/matlab/qi_mex.*
            geopdes_hierarchical_plasticity/quasi_interpolant_hierarchical/libqi/matlab/qi_local_ls_mex.*
          retention-days: 7

  # ---------------------------------------------------------------
  #  Job 2: Unit tests (fast, per-commit)
  # ---------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: MATLAB

      - name: Download MEX artifacts
        uses: actions/download-artifact@v4
        with:
          name: mex-binaries
          path: geopdes_hierarchical_plasticity/quasi_interpolant_hierarchical/libqi/matlab/

      - name: Run unit tests
        uses: matlab-actions/run-command@v2
        with:
          command: run_ci_tests('unit')
          startup-options: -sd ci

  # ---------------------------------------------------------------
  #  Job 3: Smoke integration test (per-commit)
  # ---------------------------------------------------------------
  smoke-tests:
    name: Smoke Integration Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: MATLAB

      - name: Download MEX artifacts
        uses: actions/download-artifact@v4
        with:
          name: mex-binaries
          path: geopdes_hierarchical_plasticity/quasi_interpolant_hierarchical/libqi/matlab/

      - name: Run smoke tests
        uses: matlab-actions/run-command@v2
        with:
          command: run_ci_tests('smoke')
          startup-options: -sd ci

  # ---------------------------------------------------------------
  #  Job 4: Full benchmark (manual / nightly only)
  # ---------------------------------------------------------------
  benchmark:
    name: Performance Benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_suite == 'benchmark' ||
       github.event.inputs.test_suite == 'all')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: MATLAB

      - name: Download MEX artifacts
        uses: actions/download-artifact@v4
        with:
          name: mex-binaries
          path: geopdes_hierarchical_plasticity/quasi_interpolant_hierarchical/libqi/matlab/

      - name: Run benchmark
        uses: matlab-actions/run-command@v2
        with:
          command: run_ci_tests('benchmark')
          startup-options: -sd ci

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            geopdes_hierarchical_plasticity/examples/plasticity/benchmark_results.mat
          retention-days: 30
